name: Playwright Tests (OpenCart)

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: 03-opencart-playwright-ui-automation/playwright-opencart
        run: npm install

      - name: Install Playwright browsers
        working-directory: 03-opencart-playwright-ui-automation/playwright-opencart
        run: npx playwright install --with-deps

      - name: Start OpenCart Docker stack
        working-directory: 03-opencart-playwright-ui-automation/opencart-docker
        run: docker compose up -d

      - name: Wait for OpenCart
        run: |
          echo "Waiting for OpenCart..."
          for i in {1..30}; do
            curl -s http://localhost/adminqa && break
            sleep 5
          done

      - name: Run Playwright tests
        working-directory: 03-opencart-playwright-ui-automation/playwright-opencart
        run: npx playwright test

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report