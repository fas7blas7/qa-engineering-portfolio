name: Playwright Tests (OpenCart)

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: 03-opencart-playwright-ui-automation/playwright-opencart
        run: npm install

      - name: Install Playwright browsers
        working-directory: 03-opencart-playwright-ui-automation/playwright-opencart
        run: npx playwright install --with-deps

      - name: Start OpenCart Docker stack
        working-directory: 03-opencart-playwright-ui-automation/opencart-docker
        run: docker compose up -d

      - name: Show Docker containers
        run: docker ps -a

      - name: Show Docker logs
        working-directory: 03-opencart-playwright-ui-automation/opencart-docker
        run: docker compose logs

      - name: Wait for OpenCart
        run: |
          for i in {1..10}; do
            echo "Attempt $i"
            curl -I http://127.0.0.1/adminqa || true
            sleep 5
          done
          
      - name: Run Playwright tests
        working-directory: 03-opencart-playwright-ui-automation/playwright-opencart
        run: npx playwright test -g "Add product successfully" --reporter=line

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report