name: Playwright Tests (OpenCart)

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: 03-opencart-playwright-ui-automation/playwright-opencart
        run: npm install

      - name: Install Playwright browsers
        working-directory: 03-opencart-playwright-ui-automation/playwright-opencart
        run: npx playwright install --with-deps

      - name: Start OpenCart Docker stack
        working-directory: 03-opencart-playwright-ui-automation/opencart-docker
        run: docker compose up -d

      - name: Show Docker containers
        run: docker ps -a

      - name: Show Docker logs
        working-directory: 03-opencart-playwright-ui-automation/opencart-docker
        run: docker compose logs

      - name: Wait for OpenCart
        run: |
          echo "Waiting for OpenCart"

          for i in {1..40}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1/adminqa || true)

            echo "Attempt $i -> HTTP $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "OpenCart is responding"
              exit 0
            fi

            sleep 3
          done

          echo "OpenCart failed to become ready"
          docker compose logs
          exit 1

      - name: Debug OpenCart
        run: |
          echo "=== Docker containers ==="
          docker ps

          echo "=== OpenCart page ==="
          curl -L http://127.0.0.1/adminqa/index.php?route=common/login | head -50

          echo "=== OpenCart logs ==="
          docker compose logs opencart

          echo "=== MySQL logs ==="
          docker compose logs mysql

      - name: Run Playwright tests
        working-directory: 03-opencart-playwright-ui-automation/playwright-opencart
        run: npx playwright test -g "Add product successfully" --reporter=line

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report