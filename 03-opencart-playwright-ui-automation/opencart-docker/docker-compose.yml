services:

  opencart:
    build: tools
    container_name: opencart
    ports:
      - "80:80"
    volumes:
      - ./upload:/var/www/html
      - opencart_storage:/var/www/storage
    depends_on:
      - mysql
    environment:
      DB_HOSTNAME: mysql
      DB_USERNAME: root
      DB_PASSWORD: opencart
      DB_DATABASE: opencart
    command: >
      bash -c "wait-for-it mysql:3306 -t 60 &&
               apache2-foreground"

  mysql:
    image: mysql:5.7
    container_name: opencart_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: opencart
      MYSQL_DATABASE: opencart
    volumes:
      - mysql_data:/var/lib/mysql

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - mysql

  redis:
    image: redis:latest

  memcached:
    image: memcached:latest

volumes:
  mysql_data:
  opencart_storage: