version: "3.8"

services:

  mysql:
    image: mysql:8.0
    container_name: opencart_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: opencart
      MYSQL_USER: opencart
      MYSQL_PASSWORD: opencart
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    image: php:8.1-apache
    container_name: opencart_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./upload:/var/www/html
      - opencart_storage:/var/www/storage
    depends_on:
      - mysql
    command: >
      bash -c "apt-get update &&
      apt-get install -y libzip-dev zip unzip libpng-dev libjpeg-dev libfreetype6-dev &&
      docker-php-ext-configure gd --with-freetype --with-jpeg &&
      docker-php-ext-install gd zip mysqli pdo pdo_mysql &&
      a2enmod rewrite &&
      apache2-foreground"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: opencart_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - mysql

volumes:
  mysql_data:
  opencart_storage: